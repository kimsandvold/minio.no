<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 72" fill="none">
  <!-- Concept B: Clean M peaks with foundation line (white for dark backgrounds) -->

  <!-- M peaks -->
  <path
    d="M 4,46 L 19,10 L 34,46 L 49,10 L 64,46"
    fill="none"
    stroke="#f9f9f9"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Foundation base line -->
  <line
    x1="1" y1="54"
    x2="67" y2="54"
    stroke="#f9f9f9"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Wordmark -->
  <text
    x="82"
    y="48"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', sans-serif"
    font-weight="700"
    font-size="40"
    fill="#f9f9f9"
    letter-spacing="-0.5"
  >minio</text>

  <!-- Tagline -->
  <text
    x="84"
    y="64"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', sans-serif"
    font-weight="400"
    font-size="12.5"
    fill="#f9f9f9"
    letter-spacing="0.3"
  >Fra idé til håndverk.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 56" fill="none">
  <!-- Minio: Full logo, white for dark backgrounds -->

  <!-- M peaks -->
  <path
    d="M 3,42 L 16,8 L 28,34 L 40,8 L 53,42"
    stroke="#f9f9f9"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Foundation -->
  <line x1="1" y1="49" x2="55" y2="49" stroke="#f9f9f9" stroke-width="2" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text
    x="72"
    y="38"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', sans-serif"
    font-weight="600"
    font-size="36"
    fill="#f9f9f9"
    letter-spacing="-0.5"
  >Minio</text>

  <!-- Tagline -->
  <text
    x="74"
    y="52"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', sans-serif"
    font-weight="300"
    font-size="11"
    fill="rgba(249,249,249,0.6)"
    letter-spacing="1.5"
  >Etter dine mål</text>
</svg>

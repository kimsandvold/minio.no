<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 72" fill="none">
  <!-- Concept A: Double-gable building outline forming the letter M -->
  <!-- The M is the roofline of a small workshop/building silhouette -->

  <!-- Building M mark -->
  <path
    d="M 5,62 L 5,38 L 18,10 L 31,38 L 44,10 L 57,38 L 57,62 Z"
    fill="none"
    stroke="#1a1a1a"
    stroke-width="3.8"
    stroke-linejoin="miter"
    stroke-linecap="square"
  />

  <!-- Wordmark -->
  <text
    x="74"
    y="48"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', sans-serif"
    font-weight="700"
    font-size="40"
    fill="#1a1a1a"
    letter-spacing="-0.5"
  >minio</text>

  <!-- Tagline -->
  <text
    x="76"
    y="64"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', sans-serif"
    font-weight="400"
    font-size="12.5"
    fill="#1a1a1a"
    letter-spacing="0.3"
  >Fra idé til håndverk.</text>
</svg>

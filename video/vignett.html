<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>Minio vignett</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..500&display=block" rel="stylesheet">
<style>
  /* Farger fra src/styles/theme.ts */
  :root {
    --paper: #faf7f2;
    --paper-2: #f4efe8;
    --line: #e8e1d7;
    --ink: #1c1a18;
    --ink-muted: #6b6157;
    --accent: #a8512c;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: var(--paper); font-family: "Geist", sans-serif; }

  #stage { position: absolute; inset: 0; }

  /* Blueprint-rutenett, som på planleggerne */
  #grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: center center;
    -webkit-mask-image: radial-gradient(ellipse 55% 60% at 50% 50%, #000 0%, transparent 75%);
            mask-image: radial-gradient(ellipse 55% 60% at 50% 50%, #000 0%, transparent 75%);
  }
  /* Myk vignett i kantene */
  #shade {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 80% 80% at 50% 48%, transparent 55%, rgba(74, 67, 60, 0.16) 100%);
  }

  #lockup { position: absolute; left: 50%; top: 50%; width: 1090px; transform: translate(-50%, -58%); }
  #lockup svg { width: 100%; height: auto; overflow: visible; display: block; }

  #tagline {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, 0);
    font-family: "Geist Mono", monospace; font-weight: 400;
    font-size: 30px; text-transform: uppercase; white-space: nowrap;
    color: var(--ink-muted);
  }
  #tagline b { color: var(--accent); font-weight: 500; }

  #fade { position: absolute; inset: 0; background: var(--paper); opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>

  <div id="lockup">
    <!-- Basert på public/images/branding/logo_navbar.svg (viewBox 545×148) -->

        <clipPath id="wordClip"><rect id="wordClipRect" x="185" y="30" width="0" height="90"/></clipPath>
      </defs>
      <g id="icon" stroke="#1c1a18" stroke-width="7" stroke-linecap="round" fill="none">
        <path id="frame" pathLength="1" d="M106.772 4H40.9979C20.5645 4 4 20.5918 4 41.0588V106.941C4 127.408 20.5645 144 40.9979 144H106.772C127.205 144 143.77 127.408 143.77 106.941V41.0588C143.77 20.5918 127.205 4 106.772 4Z"/>
        <g clip-path="url(#grainClip)">
        <path class="grain" pathLength="1" d="M4.76709 57.0067C13.8191 49.9032 28.1643 30.8927 46.5753 30.8927C69.2054 30.8927 72.1724 41.3408 94.1369 40.8775C111.709 40.5069 130.713 28.237 140.164 22.0601"/>

      </g>

      <g clip-path="url(#wordClip)">

      </g>

      <!-- Tommestokk: "etter dine mål" -->
      <g id="ruler" stroke="#a8512c" stroke-linecap="round">
        <line id="rulerLine" x1="194" y1="128" x2="194" y2="128" stroke-width="2.4"/>
        <g id="ticks" stroke-width="1.6"></g>
      </g>
    </svg>
  </div>

  <div id="tagline"></div>
  <div id="shade"></div>
  <div id="fade"></div>
</div>

<script>
  // Tidsstyrt animasjon: renderen kaller window.setTime(t) for hvert bilde.
  const params = new URLSearchParams(location.search);
  const MODE = params.get('mode') || 'intro';        // intro | outro
  const DURATION = MODE === 'outro' ? 7 : 6;

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const prog = (t, start, dur) => clamp((t - start) / dur);
  const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const easeOut = x => 1 - Math.pow(1 - x, 4);
  const easeOutBack = x => { const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

  const $ = s => document.querySelector(s);
  const frame = $('#frame');
  const grains = [...document.querySelectorAll('.grain')];
  const icon = $('#icon');
  const word = $('#word');
  const clipRect = $('#wordClipRect');
  const rulerLine = $('#rulerLine');
  const ticksG = $('#ticks');
  const tagline = $('#tagline');
  const grid = $('#grid');
  const fade = $('#fade');

  // Tommestokk-merker fra x=194 til x=545
  const RX0 = 194, RX1 = 545, TICKS = 40;
  const ticks = [];
  for (let i = 0; i <= TICKS; i++) {
    const x = RX0 + (RX1 - RX0) * i / TICKS;
    const len = i % 10 === 0 ? 11 : i % 5 === 0 ? 7 : 4;
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', x); l.setAttribute('x2', x);
    l.setAttribute('y1', 128); l.setAttribute('y2', 128 + len);
    ticksG.appendChild(l);
    ticks.push({ el: l, x, len });
  }

  tagline.innerHTML = MODE === 'outro'
    ? '<b>minio.no</b>&nbsp;&nbsp;·&nbsp;&nbsp;Skreddersydd etter dine mål'
    : 'Etter dine mål&nbsp;&nbsp;·&nbsp;&nbsp;<b>Håndlaget i Lillehammer</b>';

  [frame, ...grains].forEach(p => { p.style.strokeDasharray = '1 1'; });

  window.DURATION = DURATION;
  window.setTime = function (t) {
    // Bakgrunn
    grid.style.opacity = 0.9 * easeOut(prog(t, 0, 1.2));

    // Ikonet: ramme tegnes, så årringene
    const fp = easeInOut(prog(t, 0.15, 1.25));
    frame.style.strokeDashoffset = 1 - fp;
    grains.forEach((g, i) => {
      g.style.strokeDashoffset = 1 - easeInOut(prog(t, 0.75 + i * 0.13, 1.05));
    });
    const s = 0.94 + 0.06 * easeOut(prog(t, 0, 2.2));
    icon.setAttribute('transform', `translate(74 74) scale(${s}) translate(-74 -74)`);

    // Ordmerket avdekkes fra venstre
    const wp = easeInOut(prog(t, 1.9, 0.95));
    clipRect.setAttribute('width', 370 * wp);
    word.setAttribute('transform', `translate(${(1 - easeOut(prog(t, 1.9, 1.3))) * -14} 0)`);

    // Tommestokken måles ut
    const rp = easeInOut(prog(t, 2.55, 0.9));
    const rx = RX0 + (RX1 - RX0) * rp;
    rulerLine.setAttribute('x2', rx);
    rulerLine.style.opacity = rp > 0 ? 1 : 0;
    ticks.forEach(k => {
      const local = clamp((rx - k.x) / 18);
      const e = easeOutBack(local);
      k.el.setAttribute('y2', 128 + k.len * e);
      k.el.style.opacity = local > 0 ? 1 : 0;
    });

    // Tagline
    const tp = easeOut(prog(t, 3.2, 1.1));
    tagline.style.opacity = tp;
    tagline.style.letterSpacing = (0.42 - 0.14 * tp) + 'em';
    tagline.style.transform = `translate(-50%, ${150 + 10 * (1 - tp)}px)`;

    // Slutt: intro toner ut, outro blir stående
    fade.style.opacity = MODE === 'intro' ? easeInOut(prog(t, 5.25, 0.75)) : 0;
  };

  window.ready = document.fonts.ready.then(() => { window.setTime(0); return true; });
  if (!params.has('render')) {
    // Forhåndsvisning i nettleser: spill av i loop
    const t0 = performance.now();
    const loop = () => { window.setTime(((performance.now() - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); };
    window.ready.then(loop);
  }
</script>
</body>
</html>
